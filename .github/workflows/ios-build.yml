name: iOS Build Verification

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # 先跑测试（秒级失败）再进 15 分钟的 iOS 构建：测试红了就不浪费
      # macOS runner 时间，与 android-build.yml 的 test→build 顺序一致。
      - name: Run unit tests
        run: flutter test

      - name: Generate ephemeral Flutter-Generated.xcconfig
        run: |
          mkdir -p ios/Flutter/ephemeral
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          echo "FLUTTER_ROOT=${FLUTTER_ROOT}" > ios/Flutter/ephemeral/Flutter-Generated.xcconfig

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS (no codesign)
        run: flutter build ios --no-codesign --release --no-tree-shake-icons

      - name: Verify build output
        run: |
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            echo "✅ iOS build successful"
            ls -la build/ios/iphoneos/Runner.app/
          else
            echo "❌ iOS build failed"
            exit 1
          fi
