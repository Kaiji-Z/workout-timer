name: Android Build Verification

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 锁定 Flutter 版本：2026-11-15 起 stable 新版要求 Gradle ≥9.3.1，
          # 项目 gradle wrapper 仍是 8.14.3。升级此版本前必须先升 gradle
          # wrapper 并本地验证 release 构建（见 AGENTS.md 踩坑 4）。
          flutter-version: 3.47.1
          cache: true

      - name: Strip China mirrors from Gradle (CI-only)
        # 阿里云/腾讯镜像只对中国本地有用，GitHub runner 在美国会拉不到
        # Kotlin 2.1.0 等插件（"was not found"）。仅删 CI 工作副本，git 仓库文件不变，
        # 本地构建镜像配置完全不受影响。
        run: |
          for f in android/settings.gradle.kts android/build.gradle.kts; do
            sed -i -E '/maven.aliyun.com|mirrors.tencent.com/d' "$f"
          done

      - name: Get dependencies
        run: flutter pub get

      - name: Run unit tests with coverage
        run: flutter test --coverage

      - name: Coverage gate (core layers, see VERIFICATION.md)
        run: dart scripts/check_coverage.dart

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Verify build output
        run: |
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            echo "✅ Android build successful"
            ls -lh build/app/outputs/flutter-apk/app-debug.apk
          else
            echo "❌ Android build failed"
            exit 1
          fi
